version: '3.8'

services:
  pulse-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-analytics-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: pulse-analytics-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      pulse-analytics:
        condition: service_healthy

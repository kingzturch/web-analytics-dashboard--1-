events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' data: https:;" always;

        # Static Tracker SDK caching
        location /tracker.js {
            proxy_pass http://pulse-analytics:3000/tracker.js;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=3600";
        }

        # Collector Ingestion Routes
        location /api/v1/collect/ {
            proxy_pass http://pulse-analytics:3000/api/v1/collect/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health & Telemetry
        location /health {
            proxy_pass http://pulse-analytics:3000/health;
            proxy_set_header Host $host;
        }

        # Fallback to SPA Frontend / Dashboard
        location / {
            proxy_pass http://pulse-analytics:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
